<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lehrman-Deutsch</title>
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      // The placeholder below is filled in from shared/themes.ts by a Vite
      // plugin: this script cannot import, and a second copy of the roster
      // went stale.
      (() => {
        const themes = __THEMES__;
        const stored = localStorage.getItem("theme");
        document.documentElement.dataset.theme = themes.known.includes(stored)
          ? stored
          : themes.fallback;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
