<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Texts in German</title>
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      // Keep the ids in step with src/styles/themes.css.
      (() => {
        const known = ["daylight", "white", "midnight", "dusk", "black"];
        const stored = localStorage.getItem("theme");
        const fallback = matchMedia("(prefers-color-scheme: dark)").matches
          ? "midnight"
          : "daylight";
        document.documentElement.dataset.theme = known.includes(stored) ? stored : fallback;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
